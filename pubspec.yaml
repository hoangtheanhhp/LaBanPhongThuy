name: phong_thuy
description: "A hybrid Feng Shui Compass application (La Bàn Bát Quái) with integrated PWA lookup."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_compass: ^0.8.0
  sensors_plus: ^5.0.1
  webview_flutter: ^4.7.0
  go_router: ^14.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
